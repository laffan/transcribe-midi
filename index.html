<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` puts the webview under the Dynamic Island and the home
      indicator; the chrome insets itself with env(safe-area-inset-*) rather than
      letting iOS letterbox the app. `user-scalable=no` is what stops a pinch on the
      piano roll from zooming the whole UI instead of the grid.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <!-- Standalone chrome when the browser preview is added to a phone home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Unplugged" />
    <!-- Matches --bg-1 in each theme, so the status bar does not read as a seam. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15171c" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <title>Unplugged</title>
    <!-- Inline so there is no extra request (and no 404 when one is not bundled). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2315171c'/%3E%3Cg fill='%235b8dd9'%3E%3Crect x='7' y='9' width='3' height='14' rx='1'/%3E%3Crect x='13' y='6' width='3' height='20' rx='1'/%3E%3Crect x='19' y='11' width='3' height='10' rx='1'/%3E%3Crect x='25' y='8' width='3' height='16' rx='1'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

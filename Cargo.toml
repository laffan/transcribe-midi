[workspace]
members = [
    "crates/unplugged-core",
    "crates/unplugged-audio",
    "crates/unplugged-midi",
    "crates/unplugged-ai",
    "crates/unplugged-transcribe",
    "crates/unplugged-plugin",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midly = "0.5"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

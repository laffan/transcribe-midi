[package]
name = "unplugged-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The C ABI the AUv3 extension calls. No Tauri, no window, no event loop."

[lib]
# The extension links this as a static archive, the same way the app does.
crate-type = ["staticlib", "rlib"]

[dependencies]
unplugged-core = { path = "../unplugged-core" }
serde.workspace = true
serde_json.workspace = true
